# کانفیگ سراسری پروژه — منبع واحد حقیقت (single source of truth) برای هر دو دیتکتور
# مقادیر کلاس‌ها مستقیماً از data.yaml واقعی کاربر گرفته شده‌اند (Phase 0/2).

project:
  name: "brain-tumor-detector-comparison"
  seed: 42

dataset:
  kaggle_slug: "pkdarabi/medical-image-dataset-brain-tumor-detection"
  kaggle_input_path: "/kaggle/input/datasets/pkdarabi/medical-image-dataset-brain-tumor-detection/BrainTumor/BrainTumorYolov11"
  num_classes: 3
  class_names: ["glioma", "meningioma", "pituitary"]
  structure: "split/images + split/labels (زیرپوشه جدا، تایید شده)"
  annotation_format: "YOLO Segmentation Polygon (نه bbox ساده) — هر خط: class x1 y1 x2 y2 ... xn yn"
  annotation_format_note: >
    کشف شد در Phase 2.4/2.6 با اجرای واقعی روی Kaggle (تعداد ستون‌های فرد 19-29).
    برای Object Detection، bbox محاطی (min/max مختصات) از هر پالیگان استخراج می‌شود.
  class_distribution:
    # تاییدشده با اجرای واقعی روی Kaggle در 2026-08-10؛ مطابق دیتاست کلاسیک Cheng et al.
    train: {glioma: 983, meningioma: 503, pituitary: 658}
    valid: {glioma: 285, meningioma: 142, pituitary: 185}
    test:  {glioma: 159, meningioma: 62,  pituitary: 87}
    total: {glioma: 1427, meningioma: 707, pituitary: 930}
    imbalance_note: "glioma ~47% از داده — باید در Phase 3/4 و گزارش نهایی لحاظ شود"
  source_note: "همان دیتاست کلاسیک Cheng et al. (3064 تصویر T1-weighted CE-MRI)، توسط Roboflow به فرمت YOLO تبدیل شده"
  splits:
    train: {path: "train", n_images: 2144, n_labels: 2144, empty_labels: 0}
    val:   {path: "valid", n_images: 612,  n_labels: 612,  empty_labels: 0}
    test:  {path: "test",  n_images: 308,  n_labels: 308,  empty_labels: 0}
  total_images: 3064

# این بخش در Phase 3.3 نهایی و "منجمد" شد و عیناً (تا حد امکان فنی) در Phase 4 بازتولید می‌شود.
training_frozen_config:
  image_size: 640
  batch_size: 8          # با توجه به GPU T4/P100 کگل؛ در صورت OOM به 4 کاهش یابد
  epochs: 50
  optimizer: "SGD"
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_scheduler: "StepLR (step_size=15, gamma=0.1)"
  augmentation:
    bug_found_and_fixed: >
      در Phase 3 اصلی، transforms=None بود (باگ) -- Faster R-CNN بدون هیچ augmentation آموزش دید.
      در بازبینی قبل از Phase 4، این باگ اصلاح و Faster R-CNN با augmentation صحیح دوباره آموزش داده شد.
    horizontal_flip: 0.5
    brightness_contrast: 0.2
    applied_via:
      faster_rcnn: "src/models/augmentation.py -- DetectionAugmentation (تست شد: bbox و pixel content هم‌راستا)"
      yolo11: "fliplr=0.5, hsv_v=0.2 (نزدیک‌ترین معادل بومی Ultralytics به brightness/contrast)"
    documented_technical_gap: >
      Ultralytics معادل مستقیم "Contrast" ندارد؛ فقط hsv_v (نزدیک به brightness) موجود است.
      این یک محدودیت فنی مستندشده است، طبق سند اصلی که اجازه‌ی مستندسازی چنین تفاوت‌هایی را می‌دهد.
    geometric_augmentation: "عمداً خاموش (چرخش/shear) در هر دو مدل -- نامناسب برای آناتومی MRI مغز"
  note: >
    برای YOLO11 (Phase 4) همین مقادیر تا حد امکان در hyp-config Ultralytics تحمیل می‌شود؛
    هرجا YOLO محدودیت فنی داشت (مثلاً augmentation پیش‌فرض mosaic/hsv)، تفاوت صریحاً مستند می‌شود.

