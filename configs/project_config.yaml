# Phase 5 -- مقایسه‌ی apples-to-apples با پایپ‌لاین یکپارچه (src/eval/compare_models.py)
phase5_unified_comparison:
  methodology: "greedy IoU matching @ threshold=0.5، پیش‌بینی‌ها فیلترشده در confidence>=0.5"
  faster_rcnn: {precision: 0.810, recall: 0.789, f1: 0.799, mean_iou: 0.857, mean_dice: 0.919}
  yolo11: {precision: 0.863, recall: 0.799, f1: 0.830, mean_iou: 0.852, mean_dice: 0.915}
  per_class_f1:
    faster_rcnn: {glioma: 0.682, meningioma: 0.915, pituitary: 0.915}
    yolo11: {glioma: 0.742, meningioma: 0.927, pituitary: 0.909}
  full_range_conf0.05:
    faster_rcnn: {precision: 0.669, recall: 0.854, f1: 0.750}
    yolo11: {precision: 0.712, recall: 0.860, f1: 0.779}
  confusion_matrix:
    faster_rcnn: "reports/figures/faster_rcnn_confusion_matrix.png (افزوده در بازبینی 2026-08-17)"
    yolo11: "reports/figures/yolo11_confusion_matrix.png"

