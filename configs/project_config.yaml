    original: 0.799
    darker: 0.730
    brighter: 0.764
    gaussian_noise: 0.000
    salt_pepper_noise: 0.006
    gaussian_blur: 0.788
    motion_blur: 0.701
    jpeg_20: 0.629
    jpeg_50: 0.801
  yolo11_f1:
