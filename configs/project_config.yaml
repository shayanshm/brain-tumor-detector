# Phase 6 -- ارزیابی استحکام (Robustness)
phase6_robustness:
  methodology: "8 corruption types x 2 models x 308 test images, F1 @ conf>=0.5 IoU>=0.5"
  key_finding: >
    هر دو مدل در برابر نویز (Gaussian/Salt-Pepper) به‌شدت آسیب‌پذیرند (افت 80-100%) چون
    augmentation هرگز شامل نویز نبود؛ در برابر بلور/روشنایی/فشرده‌سازی نسبتاً مقاوم‌اند (افت <20%).
    YOLO11 حتی در بدترین حالت (نویز) کمی عملکرد حفظ می‌کند؛ Faster R-CNN کاملاً از کار می‌افتد.
